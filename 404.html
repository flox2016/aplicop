<style>
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;background:radial-gradient(circle at 30% 20%,#16213E 0%,#1A1A2E 45%,#0B0B16 100%);color:#fff;overflow:hidden}
  #cargando{position:fixed;inset:0;display:flex;align-items:center;justify-content:center}
  .spin{width:34px;height:34px;border-radius:50%;border:3px solid rgba(255,255,255,.15);border-top-color:#FF6B00;animation:g .8s linear infinite}

  .nf{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;padding:1.25rem}

  .logo{width:72px;height:72px;border-radius:18px;object-fit:cover;margin-bottom:1rem;box-shadow:0 6px 24px rgba(255,107,0,.35)}
  h1{font-size:1.3rem;line-height:1.3;font-weight:800;margin-bottom:.55rem}
  p{font-size:.85rem;color:#B6B9C9;margin-bottom:1.4rem;word-break:break-all}
  .btn{display:inline-block;background:#FF6B00;color:#fff;text-decoration:none;font-weight:800;font-size:.95rem;padding:.85rem 1.7rem;border-radius:14px;border:none;cursor:pointer;font-family:inherit;box-shadow:0 8px 24px rgba(255,107,0,.4)}
  .btn:hover{background:#FF8C35}
</style>
